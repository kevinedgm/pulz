<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf-fidelidad" content="F2">
<title>Wireframe · Granel: tanques y movimientos · r01</title>
<!-- kit neutral de kiwi, inline para que el artefacto se abra suelto (copia idéntica en vendor/) -->
<style>
/* kiwi · wireframe-kit.css — kit neutral F1/F2
   Solo grises, una familia, formas simples. No usar en F3 (ahí manda el sistema real). */
:root{
  --wf-g0:#ffffff; --wf-g1:#f5f5f5; --wf-g2:#ebebeb; --wf-g3:#d6d6d6; --wf-g4:#b3b3b3;
  --wf-g6:#595959; --wf-g8:#2b2b2b; --wf-g9:#111111;
  --wf-r:6px; --wf-s1:4px; --wf-s2:8px; --wf-s3:12px; --wf-s4:16px; --wf-s5:24px; --wf-s6:32px; --wf-s7:48px;
  --wf-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --wf-mono: ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body.wf{margin:0;font:15px/1.5 var(--wf-font);color:var(--wf-g9);background:var(--wf-g2)}
.wf :focus-visible{outline:3px solid var(--wf-g9);outline-offset:2px}
.wf button{font:inherit;color:inherit;cursor:pointer}
.wf a{color:inherit}
.wf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barra de control (fuera del diseño) */
.wf-ctl{position:sticky;top:0;z-index:50;background:var(--wf-g9);color:var(--wf-g0);padding:var(--wf-s2) var(--wf-s4);display:flex;flex-wrap:wrap;gap:var(--wf-s3) var(--wf-s5);align-items:center;font-size:13px}
.wf-ctl fieldset{border:0;margin:0;padding:0;display:flex;gap:var(--wf-s1);align-items:center;flex-wrap:wrap}
.wf-ctl legend{float:left;margin-right:var(--wf-s2);opacity:.8}
.wf-ctl button,.wf-ctl select{background:transparent;border:1px solid #777;color:var(--wf-g0);border-radius:4px;padding:4px 10px;min-height:32px;font:inherit}
.wf-ctl select option{color:var(--wf-g9)}
.wf-ctl button[aria-pressed="true"]{background:var(--wf-g0);color:var(--wf-g9)}
.wf-ctl label{display:flex;gap:6px;align-items:center}

/* Marco de espacio: el contenido responde con container queries */
.wf-stage{padding:var(--wf-s5) var(--wf-s4) var(--wf-s7);overflow-x:auto}
.wf-frame-label{font-size:12px;color:var(--wf-g6);margin:0 auto var(--wf-s2);width:var(--wf-w,1440px)}
.wf-frame{width:var(--wf-w,1440px);margin:0 auto;background:var(--wf-g0);border:1px solid var(--wf-g4);border-radius:10px;overflow:hidden;container:wf/inline-size;position:relative;min-height:640px}

/* Tipografía */
.wf h1{font-size:28px;line-height:1.2;margin:0 0 var(--wf-s2)}
.wf h2{font-size:20px;margin:var(--wf-s6) 0 var(--wf-s3)}
.wf h3{font-size:15px;margin:var(--wf-s4) 0 var(--wf-s2)}
.wf p{margin:0 0 var(--wf-s3)}
.wf-muted{color:var(--wf-g6)}
.wf-small{font-size:13px}
.wf code{font:13px var(--wf-mono);background:var(--wf-g1);padding:0 4px;border-radius:3px}

/* Regiones */
.wf-shell{display:grid;grid-template-columns:240px 1fr;min-height:640px}
.wf-side{background:var(--wf-g1);border-right:1px solid var(--wf-g3);padding:var(--wf-s4) var(--wf-s3)}
.wf-top{display:flex;align-items:center;gap:var(--wf-s3);padding:var(--wf-s3) var(--wf-s5);border-bottom:1px solid var(--wf-g3)}
.wf-main{padding:var(--wf-s6) var(--wf-s5);min-width:0}
.wf-bottom{position:sticky;bottom:0;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:var(--wf-s3) var(--wf-s4);display:none}

/* Bloques */
.wf-box{background:var(--wf-g2);border-radius:4px;min-height:16px}
.wf-img{background:repeating-linear-gradient(45deg,var(--wf-g2) 0 8px,var(--wf-g1) 8px 16px);border-radius:4px;aspect-ratio:4/3}
.wf-line{height:8px;background:var(--wf-g3);border-radius:2px;margin:6px 0}
.wf-card{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s4);background:var(--wf-g0);min-width:0}
.wf-grid{display:grid;gap:var(--wf-s3);grid-template-columns:repeat(var(--wf-cols,3),minmax(0,1fr))}
.wf-list{list-style:none;margin:0;padding:0;border:1px solid var(--wf-g3);border-radius:var(--wf-r)}
.wf-list>li{padding:var(--wf-s3) var(--wf-s4);min-height:48px}
.wf-list>li+li{border-top:1px solid var(--wf-g3)}
.wf-table{width:100%;border-collapse:collapse;font-size:14px}
.wf-table th,.wf-table td{text-align:left;padding:var(--wf-s2) var(--wf-s3);border-bottom:1px solid var(--wf-g3);vertical-align:top}
.wf-table th{font-size:12px;color:var(--wf-g6);text-transform:uppercase;letter-spacing:.05em}

/* Controles */
.wf-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 var(--wf-s4);border-radius:var(--wf-r);border:1px solid var(--wf-g9);background:var(--wf-g0);text-decoration:none;font-weight:600;font-size:14px}
.wf-btn--primary{background:var(--wf-g9);color:var(--wf-g0)}   /* UNA por vista */
.wf-btn--quiet{border-color:transparent;text-decoration:underline;font-weight:500}
.wf-btn--danger{border-style:dashed}                             /* destructiva: separada, forma distinta */
.wf-input{width:100%;min-height:44px;border:1px solid var(--wf-g4);border-radius:var(--wf-r);padding:0 var(--wf-s3);font:inherit;background:var(--wf-g0)}
.wf-field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.wf-actions{display:flex;flex-wrap:wrap;gap:var(--wf-s2);align-items:center}

/* Estado: forma + texto, nunca solo tono */
.wf-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid var(--wf-g6);border-radius:999px;padding:1px 8px;background:var(--wf-g0)}
.wf-status::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.wf-status--on::before{background:currentColor}
.wf-status--partial::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.wf-status--draft{border-style:dashed}
.wf-status--off{text-decoration:line-through}
.wf-tag{font-size:11px;border:1px dashed var(--wf-g6);border-radius:3px;padding:0 5px;color:var(--wf-g6)}

/* Estados de datos */
.wf-skel .wf-line,.wf-skel .wf-img{background:var(--wf-g2)}
.wf-state{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s6);text-align:center;max-width:520px;margin:var(--wf-s6) auto}
.wf-banner{padding:var(--wf-s2) var(--wf-s5);background:var(--wf-g2);border-bottom:1px solid var(--wf-g3);font-size:14px}

/* Overlays */
.wf-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20}
.wf-drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,86%);background:var(--wf-g1);z-index:21;padding:var(--wf-s3);overflow:auto}
.wf-sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--wf-g0);border-radius:12px 12px 0 0;z-index:21;padding:var(--wf-s4);overflow:auto}

/* Notas de decisión */
.wf-note{display:block;border:1px dashed var(--wf-g6);background:var(--wf-g1);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--wf-g8);margin:var(--wf-s2) 0}
.wf-note::before{content:"Nota · ";font-weight:700}
body.wf-no-notes .wf-note{display:none}

/* Modos por espacio */
@container wf (max-width: 1023px){
  .wf-shell{grid-template-columns:200px 1fr}
  .wf-grid{--wf-cols:2}
}
@container wf (max-width: 599px){
  .wf-shell{grid-template-columns:1fr}
  .wf-shell>.wf-side{display:none}
  .wf-top{padding:var(--wf-s2) var(--wf-s4)}
  .wf-main{padding:var(--wf-s5) var(--wf-s4)}
  .wf-grid{--wf-cols:1}
  .wf-bottom{display:flex;gap:var(--wf-s2)}
  .wf-main [data-wf-persist]{display:none}   /* la primaria pasa a .wf-bottom: nunca dos */
  .wf-actions .wf-btn{flex:1 1 100%}
  .wf-table--stack thead{display:none}
  .wf-table--stack tr{display:block;border-bottom:1px solid var(--wf-g3);padding:var(--wf-s2) 0}
  .wf-table--stack td{display:block;border:0;padding:2px var(--wf-s3)}
  .wf-table--stack td[data-l]::before{content:attr(data-l) " · ";color:var(--wf-g6);font-size:12px}
}

</style>
<style>
.wf .wf-btn--primary{color:var(--wf-g0)}
.wf .wf-btn:disabled{opacity:.55;cursor:not-allowed}
.gr-shell{display:grid;grid-template-columns:240px 1fr;min-height:640px}
.gr-side{background:var(--wf-g1);border-right:1px solid var(--wf-g3);padding:var(--wf-s4) var(--wf-s3)}
.gr-side ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.gr-side li{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:6px;border:2px solid transparent}
.gr-side li[aria-current]{border-color:var(--wf-g9);font-weight:700;background:var(--wf-g0)}
.gr-top{display:flex;align-items:center;gap:var(--wf-s3);min-height:56px;padding:4px var(--wf-s4) 0;border-bottom:1px solid var(--wf-g3)}
.gr-top h1{font-size:18px;margin:0 0 0 auto}
.gr-body{padding:var(--wf-s5);min-width:0;max-width:960px}
.gr-resumen{font-size:13px;color:var(--wf-g6);margin:0 0 var(--wf-s4)}
.gr-grupo h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--wf-g6);margin:var(--wf-s5) 0 var(--wf-s2)}
.gr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--wf-s3)}
.gr-tanque{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s4);background:var(--wf-g0);display:grid;gap:var(--wf-s2);min-width:0}
.gr-tanque h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gr-tanque .sub{font-size:13px;color:var(--wf-g6)}
.gr-saldo{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.gr-lote{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;padding:6px 0;border-top:1px dashed var(--wf-g3)}
.gr-lote b{font-variant-numeric:tabular-nums}
.gr-lote .h{font-size:12px;color:var(--wf-g6)}
.gr-tanque .wf-actions{margin-top:4px}
.gr-vacio{color:var(--wf-g6)}
.gr-lista{list-style:none;margin:0;padding:0}
.gr-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto auto;gap:var(--wf-s3);align-items:center;min-height:64px;padding:var(--wf-s3) var(--wf-s4);border:1px solid var(--wf-g3);border-top:0}
.gr-row:first-child{border-top:1px solid var(--wf-g3);border-radius:var(--wf-r) var(--wf-r) 0 0}
.gr-row:last-child{border-radius:0 0 var(--wf-r) var(--wf-r)}
.gr-row h3{margin:0;font-size:16px}
.gr-row .sub,.gr-datos{font-size:13px;color:var(--wf-g6)}
.gr-kpi{display:flex;flex-wrap:wrap;gap:var(--wf-s2) var(--wf-s5);margin:0 0 var(--wf-s3)}
.gr-kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.gr-kpi span{font-size:12px;color:var(--wf-g6)}
.gr-det{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--wf-s5)}
.gr-form{display:grid;gap:var(--wf-s4);max-width:720px}
.gr-form fieldset{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);display:grid;gap:var(--wf-s3);min-width:0}
.gr-form legend{font-weight:700;padding:0 4px}
.gr-fila{display:grid;grid-template-columns:1fr 1fr;gap:var(--wf-s3)}
.gr-conceptos{display:grid;gap:var(--wf-s2)}
.gr-conceptos .wf-btn{min-height:56px;justify-content:flex-start;font-size:15px;text-align:left}
.gr-conceptos .wf-btn[aria-checked="true"]{background:var(--wf-g2);border-width:3px}
.gr-conceptos .sub{font-weight:400;font-size:12px;color:var(--wf-g6);margin-left:auto;text-align:right}
.gr-seg{display:grid;grid-template-columns:1fr 1fr;gap:var(--wf-s2)}
.gr-seg .wf-btn[aria-checked="true"]{background:var(--wf-g2);border-width:3px}
.gr-aviso{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);font-size:14px}
.gr-aviso b{display:block}
.gr-alert{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);font-weight:600;font-size:14px}
.gr-warn{border:1px dashed var(--wf-g6);border-radius:var(--wf-r);padding:var(--wf-s2) var(--wf-s3);font-size:13px}
.gr-calc{font-size:14px;padding:var(--wf-s2) var(--wf-s3);border:1px dashed var(--wf-g6);border-radius:var(--wf-r)}
.gr-hecho{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s4);display:grid;gap:var(--wf-s2)}
.gr-filtros{display:flex;flex-wrap:wrap;gap:var(--wf-s2);margin:0 0 var(--wf-s3)}
.gr-filtros select{min-height:44px}
.gr-menu{position:absolute;right:var(--wf-s5);top:200px;background:var(--wf-g0);border:1px solid var(--wf-g4);border-radius:var(--wf-r);z-index:21;min-width:240px;padding:4px}
.gr-menu button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;padding:0 var(--wf-s3);font:inherit}
.gr-bottom{display:none}
@container wf (max-width: 1023px){
  .gr-shell{grid-template-columns:200px 1fr}
  .gr-det{grid-template-columns:1fr}.gr-grid{grid-template-columns:1fr}
  .gr-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a s" "b b" "c c"}
  .gr-row>div:first-child{grid-area:a}.gr-row>.gr-datos{grid-area:b}.gr-row>.wf-status{grid-area:s}.gr-row>.wf-actions{grid-area:c;justify-content:flex-start}
}
@container wf (max-width: 599px){
  .gr-shell{grid-template-columns:1fr}.gr-shell>.gr-side{display:none}
  .gr-body{padding:var(--wf-s4) var(--wf-s4) 140px}
  .gr-fila{grid-template-columns:1fr}
  .gr-form [data-wf-persist],.gr-det [data-wf-persist]{display:none}
  .gr-tanque .wf-actions .wf-btn{flex:1 1 30%}
  .gr-bottom{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:6px 4px 18px;font-size:11px;text-align:center}
  .gr-bottom span{min-height:48px;display:grid;place-items:center}
  .gr-barra{position:absolute;left:0;right:0;bottom:78px;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:var(--wf-s3) var(--wf-s4);display:flex;gap:var(--wf-s2);z-index:14}
  .gr-barra .wf-btn--primary{flex:1}
}
@container wf (min-width: 600px){.gr-barra{display:none}}
</style>
</head>
<body class="wf">
<div class="wf-ctl" role="region" aria-label="Controles del wireframe">
  <strong>GRANEL · r01 · F2</strong>
  <fieldset><legend>Espacio</legend>
    <button data-w="1440" aria-pressed="true">expanded 1440</button>
    <button data-w="768" aria-pressed="false">medium 768</button>
    <button data-w="390" aria-pressed="false">compact 390</button>
  </fieldset>
  <label>Estado
    <select id="wf-state" data-wf-states>
      <option value="default">Tanques · default (2 tanques + colector con mezcal)</option>
      <option value="loading">Tanques · carga</option>
      <option value="empty">Tanques · vacío (la empresa no tiene tanques)</option>
      <option value="vacios">Tanques · tanques sin líquido</option>
      <option value="offline">Tanques · sin conexión (solo lectura, instantánea)</option>
      <option value="readonly">Tanques · solo lectura (vencida)</option>
      <option value="operador">Tanques · operador (ve, no mueve)</option>
      <option value="long">Tanques · contenido largo (varios lotes)</option>
      <option value="tanque">Tanque · historial</option>
      <option value="tanque0">Tanque · sin movimientos</option>
      <option value="concepto">Movimiento · elegir concepto</option>
      <option value="agua">Movimiento · Agua para bajar grado (pide resultado; diferencia conocida antes)</option>
      <option value="venta">Movimiento · Venta a granel (pide contraparte)</option>
      <option value="compra">Movimiento · Compra de granel (crea lote, certificado opcional)</option>
      <option value="union">Movimiento · Unión con otro lote (conservar / renombrar)</option>
      <option value="error">Movimiento · error del servidor (saldo insuficiente)</option>
      <option value="transferir">Transferir · colector mezcal → tanque con lote (decisión)</option>
      <option value="transferir-vacio">Transferir · a tanque vacío (folio nuevo)</option>
      <option value="hecho">Movimiento · registrado (vuelve al tanque)</option>
      <option value="menu">Tanques · menú de un tanque</option>
    </select>
  </label>
  <label><input type="checkbox" id="wf-notes" checked> Notas</label>
</div>
<div class="wf-stage">
  <p class="wf-frame-label" id="wf-label"></p>
  <div class="wf-frame" id="wf-frame">
    <div class="gr-shell">
      <nav class="gr-side" aria-label="Navegación principal (shell/r01)"><strong>Mezcal Cuatro Vientos</strong>
        <ul><li>Inicio</li><li>Maguey</li><li>Horneado</li><li>Fermentación</li><li>Destilación</li><li aria-current="page">Granel</li><li>Trazabilidad</li><li>Configuración</li></ul></nav>
      <div style="min-width:0;display:flex;flex-direction:column;position:relative">
        <header class="gr-top" id="wf-top"></header>
        <div id="wf-banner"></div>
        <main class="wf-main gr-body" id="wf-view" tabindex="-1"></main>
        <nav class="gr-bottom" aria-label="Navegación principal (compact)"><span>Inicio</span><span>Fermentación</span><span>Destilación</span><span aria-current="page">Granel</span><span>Más</span></nav>
      </div>
    </div>
    <div id="wf-overlay"></div>
  </div>
</div>
<script>
// Ejemplo: Cuatro Vientos, semilla (§15.1): Tanque 1 G-COMPRA-01 250 L @ 46 (declarada); Tanque 2 G-INI-01 341.8 L @ 44.9 (Benito, 18 sep); Colector mezcal MEZ-002 8 L @ 51 (ejemplo)
const acciones = (o = {}) => o.operador ? '<span class="wf-small wf-muted">los movimientos los registra el productor</span>' : `<div class="wf-actions"><a class="wf-btn" href="#mov" ${o.dis ? 'aria-disabled="true"' : ''}>Entrada</a><a class="wf-btn" href="#mov" ${o.dis ? 'aria-disabled="true"' : ''}>Salida</a><a class="wf-btn" href="#tr" ${o.dis ? 'aria-disabled="true"' : ''}>Transferir</a></div>`;
const tanque = (t, o = {}) => `<article class="gr-tanque" aria-label="${t.c}">
  <h3><span>${t.c}</span><span class="sub">${t.cap} L · ${t.pol}</span></h3>
  ${t.lotes.length ? `<div class="gr-saldo">${t.lotes.reduce((a, l) => a + l.l, 0).toLocaleString('es-MX', { maximumFractionDigits: 1 })} L</div>${t.lotes.map(l => `<div class="gr-lote"><b>${l.f}</b><span>${l.l.toLocaleString('es-MX', { maximumFractionDigits: 1 })} L</span><span><b>${l.abv} %</b> Alc. declarado</span><span class="h">${l.q} · ${l.d}</span><span class="h">historia ${l.h}</span></div>`).join('')}` : '<div class="gr-saldo gr-vacio">vacío</div><span class="sub">Sin lote. Entra por carga inicial, compra o transferencia.</span>'}
  <a class="wf-btn wf-btn--quiet" href="#tanque" style="justify-self:start">Ver historial</a>
  ${acciones(o)}
</article>`;
const T1 = { c: 'Tanque 1', cap: '1,000', pol: 'flexible', lotes: [{ f: 'G-COMPRA-01', l: 250, abv: '46.0', q: 'Benito', d: '19 sep', h: 'declarada' }] };
const T2 = { c: 'Tanque 2', cap: '1,500', pol: 'flexible', lotes: [{ f: 'G-INI-01', l: 341.8, abv: '44.9', q: 'Benito', d: '18 sep', h: 'sin historia' }] };

  document.getElementById('wf-top').innerHTML = esLista ? topLista(o) : TOP[st]();
  document.getElementById('wf-view').innerHTML = V[st]();
  document.getElementById('wf-overlay').innerHTML = OV[st] ? OV[st]() : '';
  const banners = { offline: '<p class="wf-banner" role="status"><b>Sin conexión.</b> Puedes consultar; para mover granel necesitas señal.</p>', readonly: '<p class="wf-banner" role="status"><b>Solo lectura.</b> La suscripción venció: puedes consultar, no registrar.</p>' };
  document.getElementById('wf-banner').innerHTML = banners[st] || '';
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.w === S.w)));
}
document.addEventListener('click', e => { const w = e.target.closest('[data-w]'); if (w) { S.w = +w.dataset.w; render(); } });
document.getElementById('wf-state').addEventListener('change', e => { S.state = e.target.value; render(); });
document.getElementById('wf-notes').addEventListener('change', e => document.body.classList.toggle('wf-no-notes', !e.target.checked));
render();
</script>
</body>
</html>
