<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA r05 · viewport CSS real del iframe</title>
<style>body{margin:0;background:#eee;font:14px system-ui}header{padding:8px}button{min-height:44px}iframe{display:block;border:0;width:768px;height:1000px;background:white}</style>
<header>Arnés local r05 · <output>768</output> px

</html>
