  - {id: MH-ERROR-02, source: rule, choice: "Error, descripción y aria-invalid derivan de la misma validez", because: "corregir elimina mensaje obsoleto", status: proposed}
  - {id: MH-A11Y-02, source: rule, choice: "dialog nativo con foco inicial y devolución explícita", because: "recorrido por teclado sin escapar al fondo", status: proposed}
  - {id: MH-UNIT-02, source: product-context, choice: "Una función de formato mantiene kg en total, revisión y éxito", because: "una cifra sin unidad es ambigua", status: proposed}
