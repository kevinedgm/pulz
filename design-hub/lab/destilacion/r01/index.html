<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf-fidelidad" content="F2">
<title>Wireframe · Destilación: corridas y cortes · r01</title>
<!-- kit neutral de kiwi, inline para que el artefacto se abra suelto (copia idéntica en vendor/) -->
<style>
/* kiwi · wireframe-kit.css — kit neutral F1/F2
   Solo grises, una familia, formas simples. No usar en F3 (ahí manda el sistema real). */
:root{
  --wf-g0:#ffffff; --wf-g1:#f5f5f5; --wf-g2:#ebebeb; --wf-g3:#d6d6d6; --wf-g4:#b3b3b3;
  --wf-g6:#595959; --wf-g8:#2b2b2b; --wf-g9:#111111;
  --wf-r:6px; --wf-s1:4px; --wf-s2:8px; --wf-s3:12px; --wf-s4:16px; --wf-s5:24px; --wf-s6:32px; --wf-s7:48px;
  --wf-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --wf-mono: ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body.wf{margin:0;font:15px/1.5 var(--wf-font);color:var(--wf-g9);background:var(--wf-g2)}
.wf :focus-visible{outline:3px solid var(--wf-g9);outline-offset:2px}
.wf button{font:inherit;color:inherit;cursor:pointer}
.wf a{color:inherit}
.wf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barra de control (fuera del diseño) */
.wf-ctl{position:sticky;top:0;z-index:50;background:var(--wf-g9);color:var(--wf-g0);padding:var(--wf-s2) var(--wf-s4);display:flex;flex-wrap:wrap;gap:var(--wf-s3) var(--wf-s5);align-items:center;font-size:13px}
.wf-ctl fieldset{border:0;margin:0;padding:0;display:flex;gap:var(--wf-s1);align-items:center;flex-wrap:wrap}
.wf-ctl legend{float:left;margin-right:var(--wf-s2);opacity:.8}
.wf-ctl button,.wf-ctl select{background:transparent;border:1px solid #777;color:var(--wf-g0);border-radius:4px;padding:4px 10px;min-height:32px;font:inherit}
.wf-ctl select option{color:var(--wf-g9)}
.wf-ctl button[aria-pressed="true"]{background:var(--wf-g0);color:var(--wf-g9)}
.wf-ctl label{display:flex;gap:6px;align-items:center}

/* Marco de espacio: el contenido responde con container queries */
.wf-stage{padding:var(--wf-s5) var(--wf-s4) var(--wf-s7);overflow-x:auto}
.wf-frame-label{font-size:12px;color:var(--wf-g6);margin:0 auto var(--wf-s2);width:var(--wf-w,1440px)}
.wf-frame{width:var(--wf-w,1440px);margin:0 auto;background:var(--wf-g0);border:1px solid var(--wf-g4);border-radius:10px;overflow:hidden;container:wf/inline-size;position:relative;min-height:640px}

/* Tipografía */
.wf h1{font-size:28px;line-height:1.2;margin:0 0 var(--wf-s2)}
.wf h2{font-size:20px;margin:var(--wf-s6) 0 var(--wf-s3)}
.wf h3{font-size:15px;margin:var(--wf-s4) 0 var(--wf-s2)}
.wf p{margin:0 0 var(--wf-s3)}
.wf-muted{color:var(--wf-g6)}
.wf-small{font-size:13px}
.wf code{font:13px var(--wf-mono);background:var(--wf-g1);padding:0 4px;border-radius:3px}

/* Regiones */
.wf-shell{display:grid;grid-template-columns:240px 1fr;min-height:640px}
.wf-side{background:var(--wf-g1);border-right:1px solid var(--wf-g3);padding:var(--wf-s4) var(--wf-s3)}
.wf-top{display:flex;align-items:center;gap:var(--wf-s3);padding:var(--wf-s3) var(--wf-s5);border-bottom:1px solid var(--wf-g3)}
.wf-main{padding:var(--wf-s6) var(--wf-s5);min-width:0}
.wf-bottom{position:sticky;bottom:0;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:var(--wf-s3) var(--wf-s4);display:none}

/* Bloques */
.wf-box{background:var(--wf-g2);border-radius:4px;min-height:16px}
.wf-img{background:repeating-linear-gradient(45deg,var(--wf-g2) 0 8px,var(--wf-g1) 8px 16px);border-radius:4px;aspect-ratio:4/3}
.wf-line{height:8px;background:var(--wf-g3);border-radius:2px;margin:6px 0}
.wf-card{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s4);background:var(--wf-g0);min-width:0}
.wf-grid{display:grid;gap:var(--wf-s3);grid-template-columns:repeat(var(--wf-cols,3),minmax(0,1fr))}
.wf-list{list-style:none;margin:0;padding:0;border:1px solid var(--wf-g3);border-radius:var(--wf-r)}
.wf-list>li{padding:var(--wf-s3) var(--wf-s4);min-height:48px}
.wf-list>li+li{border-top:1px solid var(--wf-g3)}
.wf-table{width:100%;border-collapse:collapse;font-size:14px}
.wf-table th,.wf-table td{text-align:left;padding:var(--wf-s2) var(--wf-s3);border-bottom:1px solid var(--wf-g3);vertical-align:top}
.wf-table th{font-size:12px;color:var(--wf-g6);text-transform:uppercase;letter-spacing:.05em}

/* Controles */
.wf-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 var(--wf-s4);border-radius:var(--wf-r);border:1px solid var(--wf-g9);background:var(--wf-g0);text-decoration:none;font-weight:600;font-size:14px}
.wf-btn--primary{background:var(--wf-g9);color:var(--wf-g0)}   /* UNA por vista */
.wf-btn--quiet{border-color:transparent;text-decoration:underline;font-weight:500}
.wf-btn--danger{border-style:dashed}                             /* destructiva: separada, forma distinta */
.wf-input{width:100%;min-height:44px;border:1px solid var(--wf-g4);border-radius:var(--wf-r);padding:0 var(--wf-s3);font:inherit;background:var(--wf-g0)}
.wf-field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.wf-actions{display:flex;flex-wrap:wrap;gap:var(--wf-s2);align-items:center}

/* Estado: forma + texto, nunca solo tono */
.wf-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid var(--wf-g6);border-radius:999px;padding:1px 8px;background:var(--wf-g0)}
.wf-status::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.wf-status--on::before{background:currentColor}
.wf-status--partial::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.wf-status--draft{border-style:dashed}
.wf-status--off{text-decoration:line-through}
.wf-tag{font-size:11px;border:1px dashed var(--wf-g6);border-radius:3px;padding:0 5px;color:var(--wf-g6)}

/* Estados de datos */
.wf-skel .wf-line,.wf-skel .wf-img{background:var(--wf-g2)}
.wf-state{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s6);text-align:center;max-width:520px;margin:var(--wf-s6) auto}
.wf-banner{padding:var(--wf-s2) var(--wf-s5);background:var(--wf-g2);border-bottom:1px solid var(--wf-g3);font-size:14px}

/* Overlays */
.wf-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20}
.wf-drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,86%);background:var(--wf-g1);z-index:21;padding:var(--wf-s3);overflow:auto}
.wf-sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--wf-g0);border-radius:12px 12px 0 0;z-index:21;padding:var(--wf-s4);overflow:auto}

/* Notas de decisión */
.wf-note{display:block;border:1px dashed var(--wf-g6);background:var(--wf-g1);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--wf-g8);margin:var(--wf-s2) 0}
.wf-note::before{content:"Nota · ";font-weight:700}
body.wf-no-notes .wf-note{display:none}

/* Modos por espacio */
@container wf (max-width: 1023px){
  .wf-shell{grid-template-columns:200px 1fr}
  .wf-grid{--wf-cols:2}
}
@container wf (max-width: 599px){
  .wf-shell{grid-template-columns:1fr}
  .wf-shell>.wf-side{display:none}
  .wf-top{padding:var(--wf-s2) var(--wf-s4)}
  .wf-main{padding:var(--wf-s5) var(--wf-s4)}
  .wf-grid{--wf-cols:1}
  .wf-bottom{display:flex;gap:var(--wf-s2)}
  .wf-main [data-wf-persist]{display:none}   /* la primaria pasa a .wf-bottom: nunca dos */
  .wf-actions .wf-btn{flex:1 1 100%}
  .wf-table--stack thead{display:none}
  .wf-table--stack tr{display:block;border-bottom:1px solid var(--wf-g3);padding:var(--wf-s2) 0}
  .wf-table--stack td{display:block;border:0;padding:2px var(--wf-s3)}
  .wf-table--stack td[data-l]::before{content:attr(data-l) " · ";color:var(--wf-g6);font-size:12px}
}

</style>
<style>
.wf .wf-btn--primary{color:var(--wf-g0)}
.wf .wf-btn:disabled{opacity:.55;cursor:not-allowed}
.de-shell{display:grid;grid-template-columns:240px 1fr;min-height:640px}
.de-side{background:var(--wf-g1);border-right:1px solid var(--wf-g3);padding:var(--wf-s4) var(--wf-s3)}
.de-side ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.de-side li{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:6px;border:2px solid transparent}
.de-side li[aria-current]{border-color:var(--wf-g9);font-weight:700;background:var(--wf-g0)}
.de-top{display:flex;align-items:center;gap:var(--wf-s3);min-height:56px;padding:4px var(--wf-s4) 0;border-bottom:1px solid var(--wf-g3)}
.de-top h1{font-size:18px;margin:0 0 0 auto}
.de-top .wf-btn{margin-left:var(--wf-s2)}
.de-body{padding:var(--wf-s5);min-width:0;max-width:960px}
.de-resumen{font-size:13px;color:var(--wf-g6);margin:0 0 var(--wf-s4)}
.de-grupo h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--wf-g6);margin:var(--wf-s5) 0 var(--wf-s2)}
.de-lista{list-style:none;margin:0;padding:0}
.de-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto auto;gap:var(--wf-s3);align-items:center;min-height:64px;padding:var(--wf-s3) var(--wf-s4);border:1px solid var(--wf-g3);border-top:0}
.de-row:first-child{border-top:1px solid var(--wf-g3);border-radius:var(--wf-r) var(--wf-r) 0 0}
.de-row:last-child{border-radius:0 0 var(--wf-r) var(--wf-r)}
.de-row h3{margin:0;font-size:16px}
.de-row .sub,.de-datos{font-size:13px;color:var(--wf-g6)}
.de-row .wf-actions{justify-content:flex-end;flex-wrap:nowrap}
.de-fab{display:none}
.de-kpi{display:flex;flex-wrap:wrap;gap:var(--wf-s2) var(--wf-s5);margin:0 0 var(--wf-s3)}
.de-kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.de-kpi span{font-size:12px;color:var(--wf-g6)}
.de-det{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--wf-s5)}
.de-form{display:grid;gap:var(--wf-s4);max-width:720px}
.de-form fieldset{border:1px solid var(--wf-g3);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);display:grid;gap:var(--wf-s3);min-width:0}
.de-form legend{font-weight:700;padding:0 4px}
.de-asig{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--wf-s3);align-items:end}
.de-asig .sub{font-size:12px;color:var(--wf-g6)}
.de-fila{display:grid;grid-template-columns:1fr 1fr;gap:var(--wf-s3)}
.de-total{font-size:14px;padding:var(--wf-s2) var(--wf-s3);border:1px dashed var(--wf-g6);border-radius:var(--wf-r)}
.de-aviso{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);font-size:14px}
.de-aviso b{display:block}
.de-alert{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s3) var(--wf-s4);font-weight:600;font-size:14px}
.de-warn{border:1px dashed var(--wf-g6);border-radius:var(--wf-r);padding:var(--wf-s2) var(--wf-s3);font-size:13px}
.de-hecho{border:2px solid var(--wf-g9);border-radius:var(--wf-r);padding:var(--wf-s4);display:grid;gap:var(--wf-s2)}
/* corte: un concepto por pantalla */
.de-medir{max-width:520px;margin:0 auto;display:grid;gap:var(--wf-s4)}
.de-cab{display:flex;flex-wrap:wrap;gap:var(--wf-s2) var(--wf-s4);align-items:baseline;border-bottom:1px solid var(--wf-g3);padding-bottom:var(--wf-s3)}
.de-cab h2{margin:0;font-size:20px}
.de-paso{font-size:13px;color:var(--wf-g6);margin-left:auto}
.de-big{display:grid;gap:6px}
.de-big label{font-size:16px;font-weight:600}
.de-big .wf-input{font-size:2.75rem;min-height:4.5rem;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.de-big .u{font-size:14px;color:var(--wf-g6);text-align:center}
.de-clases{display:grid;gap:var(--wf-s2)}
.de-clases .wf-btn{min-height:56px;justify-content:flex-start;font-size:16px}
.de-clases .wf-btn[aria-checked="true"]{background:var(--wf-g2);border-width:3px}
.de-clases .sub{font-weight:400;font-size:13px;color:var(--wf-g6);margin-left:auto}
.de-nav{display:flex;gap:var(--wf-s2);align-items:center}
.de-nav .wf-btn--primary{flex:1}
.de-res{list-style:none;margin:0;padding:0;border:1px solid var(--wf-g3);border-radius:var(--wf-r)}
.de-res li{display:flex;justify-content:space-between;gap:var(--wf-s3);padding:var(--wf-s2) var(--wf-s4);min-height:44px;align-items:center}
.de-res li+li{border-top:1px solid var(--wf-g3)}
.de-dlg{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:min(440px,92%);background:var(--wf-g0);border:1px solid var(--wf-g4);border-radius:12px;padding:var(--wf-s5);z-index:21;display:grid;gap:var(--wf-s3)}
.de-menu{position:absolute;right:var(--wf-s5);top:180px;background:var(--wf-g0);border:1px solid var(--wf-g4);border-radius:var(--wf-r);z-index:21;min-width:240px;padding:4px}
.de-menu button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;padding:0 var(--wf-s3);font:inherit}
.de-bottom{display:none}
@container wf (max-width: 1023px){
  .de-shell{grid-template-columns:200px 1fr}
  .de-det{grid-template-columns:1fr}
  .de-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a s" "b b" "c c"}
  .de-row>div:first-child{grid-area:a}.de-row>.de-datos{grid-area:b}.de-row>.wf-status{grid-area:s}.de-row>.wf-actions{grid-area:c;justify-content:flex-start}
}
@container wf (max-width: 599px){
  .de-shell{grid-template-columns:1fr}.de-shell>.de-side{display:none}
  .de-body{padding:var(--wf-s4) var(--wf-s4) 140px}
  .de-top .wf-btn--primary{display:none}
  .de-fab{display:inline-flex;position:absolute;right:16px;bottom:88px;min-width:56px;min-height:56px;border-radius:999px;padding:0 20px;font-size:16px;z-index:15;box-shadow:0 0 0 1px var(--wf-g4)}
  .de-row .wf-actions .wf-btn{flex:0 1 auto}
  .de-fila,.de-asig{grid-template-columns:1fr}
  .de-medir [data-wf-persist],.de-form [data-wf-persist],.de-det [data-wf-persist]{display:none}
  .de-nav{display:none}
  .de-dlg{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;border-radius:12px 12px 0 0}
  .de-bottom{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:6px 4px 18px;font-size:11px;text-align:center}
  .de-bottom span{min-height:48px;display:grid;place-items:center}
  .de-barra{position:absolute;left:0;right:0;bottom:78px;background:var(--wf-g0);border-top:1px solid var(--wf-g3);padding:var(--wf-s3) var(--wf-s4);display:flex;gap:var(--wf-s2);z-index:14}
  .de-barra .wf-btn--primary{flex:1}
}
@container wf (min-width: 600px){.de-barra{display:none}}
</style>
</head>
<body class="wf">
<div class="wf-ctl" role="region" aria-label="Controles del wireframe">
  <strong>DESTILACIÓN · r01 · F2</strong>
  <fieldset><legend>Espacio</legend>
    <button data-w="1440" aria-pressed="true">expanded 1440</button>
    <button data-w="768" aria-pressed="false">medium 768</button>
    <button data-w="390" aria-pressed="false">compact 390</button>
  </fieldset>
  <label>Estado
    <select id="wf-state" data-wf-states>
      <option value="default">Corridas · default (1 abierta)</option>
      <option value="loading">Corridas · carga</option>
      <option value="empty">Corridas · vacío (ninguna abierta)</option>
      <option value="sinalambiques">Corridas · la empresa no tiene alambiques</option>
      <option value="offline">Corridas · sin conexión (instantánea, cortes pendientes)</option>
      <option value="cola">Corridas · error: corte con fallo (corrida cerrada)</option>
      <option value="readonly">Corridas · solo lectura</option>
      <option value="operador">Corridas · operador (sin «Pasar a granel»)</option>
      <option value="menu">Corridas · menú de una corrida</option>
      <option value="long">Corridas · contenido largo</option>
      <option value="abrir">Abrir corrida · formulario</option>
      <option value="abrir-aviso">Abrir corrida · 2ª con ordinario y colas (aviso) y capacidad</option>
      <option value="abrir-vacio">Abrir corrida · sin orígenes con líquido</option>
      <option value="corrida">Corrida · abierta con cortes</option>
      <option value="corrida0">Corrida · abierta sin cortes</option>
      <option value="cerrada">Corrida · cerrada</option>
      <option value="cerrar">Corrida · cerrar (confirmar)</option>
      <option value="corte1">Corte · paso 1 clase</option>
      <option value="corte2">Corte · paso 2 litros</option>
      <option value="corte-rev">Corte · revisar con aviso de capacidad</option>
      <option value="corte-ok">Corte · guardado pendiente de enviar</option>
      <option value="corte-sin">Corte · sin colector de esa clase</option>
    </select>
  </label>
  <label><input type="checkbox" id="wf-notes" checked> Notas</label>
</div>
<div class="wf-stage">
  <p class="wf-frame-label" id="wf-label"></p>
  <div class="wf-frame" id="wf-frame">
    <div class="de-shell">
      <nav class="de-side" aria-label="Navegación principal (shell/r01)"><strong>Mezcal Cuatro Vientos</strong>

        <nav class="de-bottom" aria-label="Navegación principal (compact)"><span>Inicio</span><span>Fermentación</span><span aria-current="page">Destilación</span><span>Granel</span><span>Más</span></nav>
      </div>
    </div>
    <div id="wf-overlay"></div>
  </div>
</div>
<script>
// Ejemplo: Cuatro Vientos hoy (semilla + una corrida abierta de ejemplo rotulada)
const corridaAbierta = (o = {}) => `<li class="de-row">
  <div><h3>DES-004 <span class="wf-tag">ejemplo</span></h3><span class="sub">Alambique 1 · 1ª pasada · abierta hoy 06:00 · Tomás</span></div>
  <div class="de-datos"><b>Cargó 290 L</b> · Tina 1 FER-T1-001<br><b>Cortó ${o.cortado ?? '48 L'}</b> · mezcal 8 · ordinario 40${o.pend ? ' · <span class="wf-status wf-status--draft">1 corte pendiente</span>' : ''}${o.fallo ? ' · <span class="wf-status wf-status--off">corte falló: la corrida ya estaba cerrada</span> <button class="wf-btn wf-btn--quiet">Descartar</button>' : ''}</div>
  <span class="wf-status wf-status--partial">abierta</span>
  <div class="wf-actions"><a class="wf-btn" href="#corte" ${o.dis ? 'aria-disabled="true"' : ''}>Registrar corte</a><button class="wf-btn wf-btn--quiet" aria-haspopup="menu" aria-expanded="${o.menu ? 'true' : 'false'}">Más</button></div>
