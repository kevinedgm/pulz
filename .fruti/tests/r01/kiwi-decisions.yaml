    status: frozen
  - id: GEO-METRICS-001
    region: last-measurement
    role: "comparar temperatura, Brix y actividad"
    choice: "Filas etiqueta/valor en compact; tres columnas en medium/expanded."
    size: "cada columna mínimo 112 px; región expanded mínimo 480 px"
    spacing: "12 px vertical, 16 px horizontal; separadores de 1 px"
    density: "exactamente tres métricas; null se muestra como raya"
    hierarchy: secondary-comparable
    overflow: "wrap; sin truncado ni scroll horizontal"
    source: rule
    because: "Los tres valores pertenecen a la misma lectura y deben compararse sin competir con la urgencia."
    affects: [compact, medium, expanded]
    status: frozen
  - id: GEO-ACTION-001
    region: action-footer
    role: "iniciar el registro de una medición"
    choice: "Footer separado de contenido; full-width en compact y alineado al final en medium/expanded. Nunca comparte columna con métricas."
    size: "alto mínimo 44 px; ancho completo solo en compact"
    spacing: "12 px sobre la acción; safe-area en compact"
    hierarchy: primary-action
    source: rule
    because: "Separar el CTA evita colisiones y mantiene una única acción dominante."
    alternatives_rejected: ["columna de acciones dentro de la fila expanded", "acción superpuesta a métricas"]
    affects: [compact, medium, expanded]
    status: frozen
