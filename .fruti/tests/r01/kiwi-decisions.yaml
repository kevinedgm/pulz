  rationale: "La tina es una unidad operativa independiente con una acción propia; borde y divisores expresan límite funcional, no una card decorativa."
geometry:
  - id: GEO-CONTEXT-001
    region: identity-and-freshness
    role: "identificar la tina y decidir urgencia"
    choice: "Nombre/día/estado seguidos por antigüedad; en expanded forman la región izquierda."
    size: "compact/medium: ancho completo; expanded: min 280 px y 1 fr"
    spacing: "12 px interno; 24 px hacia métricas en expanded"
