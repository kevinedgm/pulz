name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:db:runner

      # pgTAP remoto: pnpm test:db en PULZ desarrollo, nunca Supabase local.
      # Aún no se automatiza aquí: requiere credencial acotada y un fixture
      # aislado. Un run verde de este job NO certifica la base alojada.
